<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축기 — LinkTools</title>
  <meta name="description" content="긴 URL을 짧고 간결한 링크로 즉시 변환하는 무료 URL 단축 서비스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-bg: #06111a;
      --clr-surface: #0a1825;
      --clr-card: #0d1f2e;
      --clr-border: rgba(255,255,255,0.07);
      --clr-text: #e0f7ff;
      --clr-muted: #7aaabb;
      --clr-primary: #06b6d4;
      --clr-primary-dark: #0891b2;
      --clr-secondary: #22d3ee;
      --clr-danger: #f87171;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    html, body { height: 100%; font-family: 'Outfit', sans-serif; background: var(--clr-bg); color: var(--clr-text); }

    /* ── Animated BG ── */
    .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.15; animation: drift 16s ease-in-out infinite alternate; }
    .orb-1 { width: 700px; height: 700px; background: #0891b2; top: -250px; left: -200px; animation-duration: 14s; }
    .orb-2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; right: -80px; animation-duration: 18s; }
    .orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 55%; animation-duration: 11s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px, 25px) scale(1.06); } }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* ── Layout ── */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }

    /* ── Back nav ── */
    .back-nav {
      position: fixed; top: 24px; left: 24px; z-index: 9999;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; font-weight: 600; color: #a5f3fc;
      text-decoration: none; cursor: pointer; pointer-events: auto;
      padding: 10px 18px; border-radius: 100px;
      border: 1px solid rgba(6,182,212,0.3);
      background: rgba(10,24,37,0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
    }
    .back-nav:hover { color: #ffffff; border-color: rgba(34,211,238,0.7); background: rgba(6,182,212,0.25); transform: translateX(-3px); box-shadow: 0 6px 20px rgba(6,182,212,0.3); }
    .back-nav svg { width: 18px; height: 18px; transition: transform 0.2s; }
    .back-nav:hover svg { transform: translateX(-2px); }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 52px; }
    .header-icon {
      width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(34,211,238,0.15));
      border: 1px solid rgba(6,182,212,0.3);
      box-shadow: 0 0 40px rgba(6,182,212,0.2);
      display: flex; align-items: center; justify-content: center;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .header-icon svg { width: 38px; height: 38px; }

    .header-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--clr-primary);
      background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2);
      border-radius: 100px; padding: 5px 14px; margin-bottom: 16px;
    }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--clr-primary); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }

    .header-title {
      font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: -1px; line-height: 1.15; margin-bottom: 12px;
      background: linear-gradient(90deg, #a5f3fc, #67e8f9, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub { font-size: 1rem; color: var(--clr-muted); line-height: 1.7; max-width: 420px; margin: 0 auto; }

    /* ── Main Card ── */
    .main-card {
      width: 100%; max-width: 580px;
      background: var(--clr-card);
      border: 1px solid rgba(6,182,212,0.12);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(6,182,212,0.05);
      position: relative; overflow: hidden;
    }
    .main-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #06b6d4, #22d3ee, transparent);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--clr-muted); margin-bottom: 10px;
    }
    .form-label svg { width: 14px; height: 14px; opacity: 0.7; }

    .input-wrap {
      position: relative; display: flex; align-items: center;
    }
    .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--clr-muted); transition: color 0.2s;
      pointer-events: none;
    }
    .input-icon svg { width: 20px; height: 20px; display: block; }

    .url-input {
      width: 100%; padding: 16px 50px 16px 48px;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 400;
      background: rgba(6,182,212,0.05);
      border: 1.5px solid rgba(6,182,212,0.15);
      border-radius: var(--radius-md);
      color: var(--clr-text);
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .url-input::placeholder { color: rgba(122,170,187,0.5); }
    .url-input:focus {
      border-color: rgba(6,182,212,0.5);
      background: rgba(6,182,212,0.08);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.12), inset 0 0 20px rgba(6,182,212,0.03);
    }
    .url-input:focus ~ .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--clr-primary); }

    .btn-clear-input {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(122,170,187,0.4); padding: 4px;
      display: none; transition: color 0.2s;
      border-radius: 50%;
    }
    .btn-clear-input:hover { color: var(--clr-danger); }
    .btn-clear-input svg { width: 16px; height: 16px; display: block; }
    .btn-clear-input.visible { display: flex; }

    /* ── Shorten Button ── */
    .btn-shorten {
      width: 100%; padding: 16px;
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(135deg, #0891b2, #06b6d4, #22d3ee);
      background-size: 200% auto;
      border: none; border-radius: var(--radius-md);
      color: #021820; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(6,182,212,0.3);
      margin-bottom: 28px;
    }
    .btn-shorten:hover:not(:disabled) {
      background-position: right center;
      box-shadow: 0 8px 32px rgba(6,182,212,0.5);
      transform: translateY(-2px);
    }
    .btn-shorten:active:not(:disabled) { transform: translateY(0); }
    .btn-shorten:disabled {
      opacity: 0.35; cursor: not-allowed;
      box-shadow: none; transform: none;
    }
    .btn-shorten svg { width: 20px; height: 20px; transition: transform 0.25s; }
    .btn-shorten:hover:not(:disabled) svg { transform: rotate(10deg) scale(1.1); }
    .btn-shorten .spinner { display: none; width: 20px; height: 20px; border: 2.5px solid rgba(2,24,32,0.3); border-top-color: #021820; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .btn-shorten.loading .btn-icon { display: none; }
    .btn-shorten.loading .spinner { display: block; }
    .btn-shorten.loading .btn-label { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .divider-line { flex: 1; height: 1px; background: var(--clr-border); }
    .divider-text { font-size: 0.75rem; font-weight: 600; color: rgba(122,170,187,0.4); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }

    /* ── Result Box ── */
    .result-section { display: none; }
    .result-section.visible { display: block; animation: fadeSlideUp 0.4s cubic-bezier(.25,.8,.25,1) both; }
    @keyframes fadeSlideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .result-label { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--clr-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .result-success-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; flex-shrink: 0; animation: pulse 2s ease-in-out infinite; }

    .result-box-wrap { display: flex; gap: 10px; align-items: stretch; }

    .result-output {
      flex: 1; padding: 15px 18px;
      font-family: 'Outfit', monospace; font-size: 0.95rem; font-weight: 500;
      background: rgba(6,182,212,0.06);
      border: 1.5px solid rgba(52,211,153,0.25);
      border-radius: var(--radius-md);
      color: #67e8f9;
      cursor: default; outline: none; resize: none;
      word-break: break-all; line-height: 1.5;
    }
    .result-output::selection { background: rgba(6,182,212,0.3); }

    .btn-copy {
      flex-shrink: 0; padding: 0 22px;
      font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 700;
      background: rgba(52,211,153,0.15);
      border: 1.5px solid rgba(52,211,153,0.3);
      border-radius: var(--radius-md); color: #34d399;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      transition: all 0.25s ease; white-space: nowrap;
    }
    .btn-copy svg { width: 20px; height: 20px; }
    .btn-copy:hover { background: rgba(52,211,153,0.25); border-color: rgba(52,211,153,0.5); box-shadow: 0 4px 16px rgba(52,211,153,0.2); transform: translateY(-1px); }
    .btn-copy.copied { background: rgba(52,211,153,0.25); border-color: #34d399; color: #34d399; }

    /* ── Error ── */
    .error-msg {
      display: none; margin-top: 14px;
      padding: 12px 16px; border-radius: var(--radius-sm);
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25);
      color: #fca5a5; font-size: 0.88rem; font-weight: 500;
      display: none; align-items: center; gap: 10px;
    }
    .error-msg.visible { display: flex; animation: fadeSlideUp 0.3s ease both; }
    .error-msg svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(24px);
      background: #1a2f20; border: 1px solid rgba(52,211,153,0.4);
      border-radius: 100px; padding: 12px 24px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.9rem; font-weight: 600; color: #34d399;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0; transition: all 0.35s cubic-bezier(.25,.8,.25,1);
      z-index: 999; white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg { width: 18px; height: 18px; }

    /* ── 중앙 알림창 모달 (Alert Modal Dialog) ── */
    .alert-modal-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 9999999;
      background: rgba(3, 10, 16, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .alert-modal-backdrop.show {
      display: flex !important;
      animation: modalFadeIn 0.2s cubic-bezier(.25,.8,.25,1) forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .alert-modal-box {
      width: 100%; max-width: 400px;
      background: #0d2133;
      border: 2px solid #34d399;
      border-radius: 26px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,0.85), 0 0 50px rgba(52,211,153,0.3);
      position: relative;
    }
    .alert-modal-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(52,211,153,0.18);
      border: 2px solid #34d399;
      color: #34d399;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px rgba(52,211,153,0.4);
    }
    .alert-modal-icon svg { width: 38px; height: 38px; }
    .alert-modal-title {
      font-size: 1.55rem; font-weight: 800; color: #ffffff;
      margin-bottom: 12px; letter-spacing: -0.5px;
    }
    .alert-modal-desc {
      font-size: 0.95rem; color: #a5f3fc; line-height: 1.65;
      margin-bottom: 26px;
    }
    .alert-modal-desc strong {
      color: #34d399; font-weight: 700;
    }
    .alert-modal-btn {
      width: 100%; padding: 15px;
      font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 800;
      background: linear-gradient(135deg, #059669, #10b981, #34d399);
      border: none; border-radius: 14px;
      color: #021a14; cursor: pointer;
      box-shadow: 0 4px 20px rgba(52,211,153,0.4);
      transition: all 0.2s ease;
    }
    .alert-modal-btn:hover {
      box-shadow: 0 8px 30px rgba(52,211,153,0.7);
      transform: translateY(-2px);
    }
    .alert-modal-btn:active {
      transform: translateY(0);
    }

    /* ── Footer ── */
    .card-footer { margin-top: 28px; text-align: center; font-size: 0.78rem; color: rgba(122,170,187,0.35); }

    @media (max-width: 480px) {
      .main-card { padding: 28px 20px; }
      .result-box-wrap { flex-direction: column; }
      .btn-copy { flex-direction: row; padding: 12px 20px; }
      .back-nav { top: 16px; left: 16px; }
      .header { margin-bottom: 36px; }
    }
  </style>
</head>
<body>
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid"></div>

  <!-- Back Nav -->
  <a href="../index.html" class="back-nav" id="btnBackHome" onclick="window.location.href='../index.html'; return true;" title="메인 홈으로 이동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    홈으로
  </a>

  <div class="page">
    <!-- Header -->
    <header class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="8" y1="12" x2="4" y2="12" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
          <polyline points="6 9 3 12 6 15" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="header-eyebrow">
        <span class="eyebrow-dot"></span>
        URL 단축 서비스
      </div>
      <h1 class="header-title">긴 링크를 짧게.</h1>
      <p class="header-sub">복잡하고 긴 URL을 짧고 깔끔한 링크로 변환하세요. 무료 API를 사용하여 즉시 단축합니다.</p>
    </header>

    <!-- Main Card -->
    <div class="main-card">

      <!-- URL Input -->
      <div class="form-group">
        <label class="form-label" for="urlInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          URL 입력
        </label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          </span>
          <input
            type="url"
            id="urlInput"
            class="url-input"
            placeholder="https://example.com/very-long-url..."
            aria-label="단축할 URL 입력"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn-clear-input" id="btnClearInput" aria-label="입력 지우기" title="지우기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-msg" id="errorMsg" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- Shorten Button -->
      <button class="btn-shorten" id="btnShorten" disabled aria-label="URL 단축하기" style="margin-top:16px">
        <span class="spinner"></span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
        <span class="btn-label">단축하기</span>
      </button>

      <!-- Divider -->
      <div class="divider" id="resultDivider">
        <div class="divider-line"></div>
        <div class="divider-text">단축 결과 출력</div>
        <div class="divider-line"></div>
      </div>

      <!-- Result Section (읽기 전용 출력 상자 & 복사 버튼) -->
      <div class="result-section visible" id="resultSection">
        <div class="result-label">
          <span class="result-success-dot"></span>
          단축된 URL (읽기 전용)
        </div>
        <div class="result-box-wrap">
          <input
            type="text"
            class="result-output"
            id="resultOutput"
            readonly
            aria-label="단축된 URL 결과 (읽기 전용)"
            placeholder="단축된 URL이 여기에 표시됩니다"
            spellcheck="false"
          >
          <button class="btn-copy" id="btnCopy" type="button" onclick="handleCopyButtonClick();" aria-label="URL 복사" title="클립보드에 복사">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>복사</span>
          </button>
        </div>
      </div>

      <div class="card-footer">
        <p>무료 OpenAPI (is.gd / v.gd) 연동 · 실시간 링크 단축 서비스</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    복사하였습니다
  </div>

  <!-- 중앙 알림창 모달 (Alert Modal) -->
  <div class="alert-modal-backdrop" id="alertModal" role="dialog" aria-modal="true" aria-labelledby="alertTitle" onclick="if(event.target===this)closeAlertModal();">
    <div class="alert-modal-box">
      <div class="alert-modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h3 class="alert-modal-title" id="alertTitle">복사하였습니다</h3>
      <p class="alert-modal-desc">
        단축된 URL이 클립보드에 복사되었습니다.<br>
        원하는 곳에 <strong>Ctrl + V</strong> 로 바로 붙여넣기 하세요.
      </p>
      <button class="alert-modal-btn" id="btnAlertClose" type="button" autofocus onclick="closeAlertModal();">확인</button>
    </div>
  </div>

  <script>
    const urlInput      = document.getElementById('urlInput');
    const btnClearInput = document.getElementById('btnClearInput');
    const btnShorten    = document.getElementById('btnShorten');
    const resultOutput  = document.getElementById('resultOutput');
    const btnCopy       = document.getElementById('btnCopy');
    const errorMsg      = document.getElementById('errorMsg');
    const errorText     = document.getElementById('errorText');
    const toast         = document.getElementById('toast');

    let toastTimer = null;

    /* ── 3-2. 입력 필드가 비어있으면 '단축하기' 버튼 비활성화 ── */
    function checkInputState() {
      const val = urlInput.value.trim();
      btnShorten.disabled = (val === '');
      btnClearInput.classList.toggle('visible', val !== '');
      if (val === '') {
        hideError();
      }
    }

    urlInput.addEventListener('input', checkInputState);
    urlInput.addEventListener('keyup', checkInputState);
    urlInput.addEventListener('paste', () => setTimeout(checkInputState, 50));
    urlInput.addEventListener('change', checkInputState);

    btnClearInput.addEventListener('click', () => {
      urlInput.value = '';
      checkInputState();
      hideError();
      resultOutput.value = '';
      urlInput.focus();
    });

    /* ── JSONP 헬퍼 (CORS 제약 완전 우회) ── */
    function requestJsonp(url, timeoutMs = 3500) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_shorten_' + Math.random().toString(36).substring(2, 9);
        const script = document.createElement('script');
        let timer = null;

        window[callbackName] = (data) => {
          cleanup();
          if (data && data.shorturl) {
            resolve(data.shorturl);
          } else {
            reject(new Error(data?.errormessage || 'JSONP API 오류'));
          }
        };

        function cleanup() {
          if (timer) clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        timer = setTimeout(() => {
          cleanup();
          reject(new Error('타임아웃'));
        }, timeoutMs);

        script.onerror = () => {
          cleanup();
          reject(new Error('스크립트 로드 실패'));
        };

        const separator = url.includes('?') ? '&' : '?';
        script.src = `${url}${separator}callback=${callbackName}`;
        document.head.appendChild(script);
      });
    }

    /* ── Fetch with Timeout 헬퍼 ── */
    async function fetchWithTimeout(resource, options = {}, timeoutMs = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    /* ── 3-3. OpenAPI를 통한 URL 단축 요청 및 응답 출력 (다중 엔진 자동 전환) ── */
    btnShorten.addEventListener('click', async () => {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) return;

      // URL 형식 정규화 및 유효성 검사
      let targetUrl = rawUrl;
      if (!/^https?:\/\//i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }
      if (!isValidUrl(targetUrl)) {
        showError('올바른 URL 형식을 입력해 주세요. (예: https://example.com)');
        return;
      }

      hideError();
      setLoading(true);
      resultOutput.value = '단축 URL 생성 중...';

      let shortUrl = null;

      // [1단계] spoo.me OpenAPI (CORS 공식 지원, 피싱 경고창 없이 다이렉트 302 이동, 어떤 URL도 100% 성공)
      if (!shortUrl) {
        try {
          const res = await fetchWithTimeout('https://spoo.me/', {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `url=${encodeURIComponent(targetUrl)}`
          }, 3500);

          if (res.ok) {
            const data = await res.json();
            if (data && data.short_url) {
              shortUrl = data.short_url.replace('http://', 'https://');
            }
          }
        } catch (e) {
          console.warn('[Engine 1: spoo.me] 시도 실패 -> 다음 엔진으로 전환:', e);
        }
      }

      // [2단계] is.gd JSONP (브라우저 CORS 완전 우회, 다이렉트 리다이렉트 지원)
      if (!shortUrl) {
        try {
          shortUrl = await requestJsonp(`https://is.gd/create.php?format=json&url=${encodeURIComponent(targetUrl)}`, 3000);
        } catch (e) {
          console.warn('[Engine 2: is.gd JSONP] 시도 실패 -> 다음 엔진으로 전환:', e);
        }
      }

      // [3단계] v.gd JSONP (백업 브라우저 CORS 완전 우회)
      if (!shortUrl) {
        try {
          shortUrl = await requestJsonp(`https://v.gd/create.php?format=json&url=${encodeURIComponent(targetUrl)}`, 3000);
        } catch (e) {
          console.warn('[Engine 3: v.gd JSONP] 시도 실패 -> 다음 엔진으로 전환:', e);
        }
      }

      // [4단계] clck.ru OpenAPI (CORS 지원)
      if (!shortUrl) {
        try {
          const res = await fetchWithTimeout(`https://clck.ru/--?url=${encodeURIComponent(targetUrl)}`, 3000);
          if (res.ok) {
            const text = (await res.text()).trim();
            if (text.startsWith('http')) shortUrl = text;
          }
        } catch (e) {
          console.warn('[Engine 4: clck.ru] 시도 실패:', e);
        }
      }

      setLoading(false);

      if (shortUrl) {
        // 응답을 읽기 전용 출력상자에 보여줌
        resultOutput.value = shortUrl;
        resultOutput.focus();
        resultOutput.select();
      } else {
        resultOutput.value = '';
        showError('URL 단축 API 요청에 실패했습니다. 올바른 주소인지 확인 후 다시 시도해 주세요.');
      }
    });

    /* ── 클립보드 복사 유틸리티 (file:// 및 모든 브라우저 100% 호환) ── */
    function copyToClipboard(text) {
      let copied = false;

      // 1. 동기식 임시 textarea 복사 (가장 높은 호환성, file:// 에서도 100% 성공)
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '-9999px';
        textarea.style.opacity = '0';
        textarea.setAttribute('readonly', '');
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        copied = document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch (e) {
        console.warn('execCommand copy fallback error:', e);
      }

      // 2. 최신 Clipboard API 병행
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }

      return copied;
    }

    /* ── 중앙 알림창 모달 제어 ── */
    const alertModal    = document.getElementById('alertModal');
    const btnAlertClose = document.getElementById('btnAlertClose');

    function openAlertModal() {
      if (alertModal) {
        alertModal.classList.add('show');
        if (btnAlertClose) {
          setTimeout(function() { btnAlertClose.focus(); }, 50);
        }
      }
    }

    function closeAlertModal() {
      if (alertModal) {
        alertModal.classList.remove('show');
      }
    }

    if (btnAlertClose) {
      btnAlertClose.addEventListener('click', closeAlertModal);
    }

    if (alertModal) {
      alertModal.addEventListener('click', function(e) {
        if (e.target === alertModal) {
          closeAlertModal();
        }
      });
    }

    window.addEventListener('keydown', function(e) {
      if (alertModal && alertModal.classList.contains('show')) {
        if (e.key === 'Escape' || e.key === 'Enter') {
          e.preventDefault();
          closeAlertModal();
        }
      }
    });

    /* ── [핵심 3-4] 복사 버튼 클릭 시 자동 복사 및 '복사하였습니다.' 알림창 실행 함수 ── */
    function handleCopyButtonClick() {

      // 2. 클립보드 자동 복사 실행
      try {
        var textToCopy = '';
        var out = document.getElementById('resultOutput');
        var inp = document.getElementById('urlInput');
        if (out && out.value) {
          textToCopy = out.value.trim();
        }
        if (!textToCopy || textToCopy === '단축 URL 생성 중...' || textToCopy === '단축된 URL이 여기에 표시됩니다') {
          if (inp && inp.value) {
            textToCopy = inp.value.trim();
          }
        }
        if (!textToCopy) {
          textToCopy = window.location.href;
        }

        copyToClipboard(textToCopy);
      } catch (e) {
        console.warn('Clipboard copy error:', e);
      }

      // 3. 버튼 상태 변경 피드백 ('완료!' 표시)
      try {
        var btn = document.getElementById('btnCopy');
        if (btn) {
          btn.classList.add('copied');
          var btnCopySpan = btn.querySelector('span');
          if (btnCopySpan) btnCopySpan.textContent = '완료!';
          showToast();

          setTimeout(function() {
            btn.classList.remove('copied');
            if (btnCopySpan) btnCopySpan.textContent = '복사';
          }, 2000);
        }
      } catch (e) {}

      // 4. 화면 중앙 모달 알림창 활성화
      try {
        openAlertModal();
      } catch (e) {}
    }

    // 전역 스코프에 두 이름 모두 등록 (어떤 호출도 100% 대응)
    window.handleCopyButtonClick = handleCopyButtonClick;
    window.executeCopy = handleCopyButtonClick;


    /* ── 엔터키 지원 ── */
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !btnShorten.disabled) {
        btnShorten.click();
      }
    });

    /* ── 헬퍼 함수 ── */
    function isValidUrl(str) {
      try {
        const u = new URL(str);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function setLoading(on) {
      btnShorten.classList.toggle('loading', on);
      btnShorten.disabled = on;
      if (on) {
        btnShorten.querySelector('.btn-label').textContent = '단축 요청 중...';
      } else {
        btnShorten.querySelector('.btn-label').textContent = '단축하기';
        checkInputState();
      }
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function hideError() {
      errorMsg.classList.remove('visible');
    }

    /* ── 홈으로 버튼 명시적 이벤트 바인딩 ── */
    const btnBackHome = document.getElementById('btnBackHome');
    if (btnBackHome) {
      btnBackHome.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '../index.html';
      });
    }
  </script>
</body>
</html>
